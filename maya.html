<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5b3d4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-box input[type="text"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .login-box input[type="submit"] {
      width: 100%;
      padding: 10px;
      background-color: #f24cbe;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .login-box input[type="submit"]:hover {
      background-color: #f296c9;
    }
    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Iniciar Sesión</h2>
    <form onsubmit="return validarLogin(event)">
      <input type="text" id="usuario" placeholder="Usuario" required>
      <input type="password" id="contraseña" placeholder="Contraseña" required>
      <input type="submit" value="Entrar">
      <div id="mensaje-error" class="error"></div>
    </form>
  </div>

  <script>
    function validarLogin(event) {
      event.preventDefault(); // Evita que se recargue la página
      const usuario = document.getElementById('usuario').value;
      const contraseña = document.getElementById('contraseña').value;
      const mensaje = document.getElementById('mensaje-error');

      // Usuario y contraseña definidos
      const usuarioCorrecto = "admin";
      const contraseñaCorrecta = "1234";

      if (usuario === usuarioCorrecto && contraseña === contraseñaCorrecta) {
        alert("¡Bienvenido, " + usuario + "!");
        // Redirige a "maya2.html"
        window.location.href = "maya2.html";
      } else {
        mensaje.textContent = "Usuario o contraseña incorrectos.";
      }
    }
  </script>
</body>
</html>
