<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresa tu fecha de nacimiento</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .scroll-text {
      white-space: nowrap;
      animation: scroll 10s linear infinite;
      font-size: 2em;
      margin-bottom: 30px;
    }

    @keyframes scroll {
      0% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    .image-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .cat-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
    }

    .calendar-input {
      padding: 10px;
      border: 2px solid #f296c9;
      border-radius: 6px;
      background-color: #ffe6f0;
      color: #333;
      font-size: 1em;
    }
  </style>
</head>
<body>

  <div class="scroll-text">Citas de la Doctora Maya</div>

  <div class="image-container">
    <!-- Imagen del gatito -->
    <img src="gato.jpg" alt="Gato lindo">

    <!-- Calendario (selector de fecha) -->
    <input type="date" class= "calendar-input" />
  </div>

</body>
</html>
